version: '3.8'

services:
  # PostgreSQL для тестирования
  postgres-test:
    image: postgres:15-alpine
    container_name: ctm-postgres-test
    environment:
      POSTGRES_DB: construction_test
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_password
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "5432:5432"
    volumes:
      - postgres_test_data:/var/lib/postgresql/data
    command: >
      postgres
      -c max_connections=200
      -c shared_buffers=256MB
      -c effective_cache_size=1GB
      -c maintenance_work_mem=64MB
      -c checkpoint_completion_target=0.9
      -c wal_buffers=16MB
      -c default_statistics_target=100
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d construction_test -t 5"]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 30s
    restart: unless-stopped
    networks:
      - test-network

  # MySQL для тестирования - упрощенная конфигурация
  mysql-test:
    image: mysql:8.0
    container_name: ctm-mysql-test
    environment:
      MYSQL_ROOT_PASSWORD: root_password
      MYSQL_DATABASE: construction_test
      MYSQL_USER: test_user
      MYSQL_PASSWORD: test_password
    ports:
      - "3306:3306"
    volumes:
      - mysql_test_data:/var/lib/mysql
    command: >
      --default-authentication-plugin=mysql_native_password
      --max_connections=500
      --innodb_buffer_pool_size=256M
      --wait_timeout=28800
      --interactive_timeout=28800
      --net_read_timeout=300
      --net_write_timeout=300
      --max_allowed_packet=32M
      --connect_timeout=30
      --sql_mode=STRICT_TRANS_TABLES,NO_ZERO_DATE,NO_ZERO_IN_DATE,ERROR_FOR_DIVISION_BY_ZERO
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-proot_password", "--connect-timeout=5"]
      interval: 10s
      timeout: 10s
      retries: 15
      start_period: 45s
    restart: unless-stopped
    networks:
      - test-network

  # Adminer для управления БД (опционально)
  adminer:
    image: adminer:latest
    container_name: ctm-adminer
    ports:
      - "8080:8080"
    networks:
      - test-network
    depends_on:
      - postgres-test
      - mysql-test

volumes:
  postgres_test_data:
    driver: local
  mysql_test_data:
    driver: local

networks:
  test-network:
    driver: bridge