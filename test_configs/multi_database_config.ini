[PostgreSQL]
host = localhost
port = 5432
database = construction_test_db
username = test_user
password = test_password
driver = psycopg2

[MySQL]
host = localhost
port = 3306
database = construction_test_db
username = test_user
password = test_password
driver = pymysql

[SQLite]
database_path = test_databases/server_test.db
driver = sqlite3

[TestScenarios]
# Scenario 1: PostgreSQL server with mixed clients
postgresql_mixed_server_db = postgresql
postgresql_mixed_client_1_db = sqlite
postgresql_mixed_client_2_db = mysql
postgresql_mixed_client_3_db = mysql

# Scenario 2: MySQL server with mixed clients
mysql_mixed_server_db = mysql
mysql_mixed_client_1_db = sqlite
mysql_mixed_client_2_db = sqlite
mysql_mixed_client_3_db = mysql

# Scenario 3: SQLite server with MySQL clients
sqlite_mysql_server_db = sqlite
sqlite_mysql_client_1_db = mysql
sqlite_mysql_client_2_db = mysql
sqlite_mysql_client_3_db = mysql

[TestSettings]
default_timeout = 30
max_sync_duration = 120
migration_timeout = 300
cleanup_after_test = true
verbose_logging = false
generate_performance_report = true

[AlembicSettings]
config_file = alembic.ini
migrations_dir = alembic/versions
auto_generate_migrations = true
test_migration_prefix = test_

[ReportSettings]
output_directory = test_reports
include_performance_metrics = true
include_schema_comparison = true
include_error_details = true
report_formats = json,text,summary